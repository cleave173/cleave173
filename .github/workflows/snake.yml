name: Contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs (light + dark)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contribution-snake.svg?palette=github-light&color_snake=#608B20&color_dots=#EBEDF0,#C8D4BC,#A5BC88,#82A354,#608B20
            dist/contribution-snake-dark.svg?palette=github-dark&color_snake=#BADF74&color_dots=#161B22,#3F4C36,#687D4B,#91AE5F,#BADF74

      - name: Push SVG to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
